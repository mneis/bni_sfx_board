<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNI Soundboard</title>
    <link rel="stylesheet" href="style.css?v=2026.06.09.1">
</head>
<body>
    <header class="topo">
        <div>
            <h1 id="title">BNI Soundboard</h1>
            <p id="subtitle" class="subtitulo">Live audio operation for BNI meetings</p>
        </div>
        <div class="controles-globais">
            <label class="language-switch" for="locale-selector">
                <span id="language-label">Language</span>
                <select id="locale-selector">
                    <option value="enus">English (US)</option>
                    <option value="ptbr">Português (BR)</option>
                </select>
            </label>
        </div>
    </header>

    <section class="quick-actions" id="quick-actions">
        <div class="quick-header">
            <h2 id="quick-title">Quick Actions</h2>
            <div class="quick-controls">
                <button id="quick-edit" class="botao-secundario">Edit</button>
                <button id="quick-reset" class="botao-secundario botao-perigo">Reset</button>
                <button id="quick-toggle" class="botao-secundario">Minimize</button>
            </div>
        </div>
        <p id="quick-help" class="quick-help">Shortcuts for your most used effects during the meeting.</p>
        <div id="quick-actions-grid" class="grid-botoes grid-quick"></div>
    </section>

    <section class="spotify-panel" id="spotify-panel">
        <div class="spotify-header">
            <div>
                <h2 id="spotify-title">Spotify</h2>
                <p id="spotify-status" class="spotify-status">Disconnected</p>
            </div>
            <div class="spotify-actions">
                <button id="spotify-connect" class="botao-secundario" type="button">Connect</button>
                <button id="spotify-disconnect" class="botao-secundario" type="button">Disconnect</button>
            </div>
        </div>

        <div class="spotify-grid">
            <label class="spotify-field" for="spotify-client-id">
                <span id="spotify-client-label">Client ID</span>
                <input id="spotify-client-id" type="text" autocomplete="off" spellcheck="false">
            </label>
            <button id="spotify-save-client" class="botao-secundario" type="button">Save</button>
            <label class="spotify-field" for="spotify-device-select">
                <span id="spotify-device-label">Device</span>
                <select id="spotify-device-select"></select>
            </label>
            <button id="spotify-refresh-devices" class="botao-secundario" type="button">Refresh</button>
            <button id="spotify-transfer" class="botao-secundario" type="button">Transfer</button>
        </div>

        <div class="spotify-player">
            <div class="spotify-transport">
                <button id="spotify-previous" class="botao-secundario" type="button">Prev</button>
                <button id="spotify-play-pause" class="botao-secundario spotify-play" type="button">Play</button>
                <button id="spotify-next" class="botao-secundario" type="button">Next</button>
            </div>
            <div class="spotify-volume">
                <span id="spotify-volume-label">Music Volume</span>
                <button id="spotify-volume-down" class="botao-volume" type="button" aria-label="Spotify volume down">-</button>
                <input id="spotify-volume" type="range" min="0" max="100" step="5" value="50" aria-labelledby="spotify-volume-label">
                <button id="spotify-volume-up" class="botao-volume" type="button" aria-label="Spotify volume up">+</button>
                <output id="spotify-volume-value" for="spotify-volume">50%</output>
            </div>
        </div>

        <div class="spotify-now">
            <span id="spotify-playback-status">Playback: -</span>
            <span id="spotify-track">Track: -</span>
        </div>
    </section>

    <main id="soundboard-container">
    </main>

    <section class="control-dock" aria-label="Live Controls">
        <button id="dock-handle" class="dock-handle" type="button" aria-label="Drag controls" title="Drag controls">⋮⋮</button>
        <div class="control-main">
            <button id="stop-all" class="botao-controle">Stop All</button>
            <button id="fullscreen-toggle" class="botao-secundario botao-fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
            <label class="controle-volume" for="volume-master">
                <div class="volume-label-stack">
                    <span id="volume-label">Volume</span>
                    <output id="volume-value" class="volume-value" for="volume-master">100%</output>
                </div>
                <div class="volume-control-row">
                    <button id="volume-down" class="botao-volume" type="button" aria-label="Volume down">-</button>
                    <div class="volume-slider-shell">
                        <input id="volume-master" type="range" min="0" max="1" step="0.05" value="1">
                    </div>
                    <button id="volume-up" class="botao-volume" type="button" aria-label="Volume up">+</button>
                </div>
            </label>
        </div>
        <span id="now-playing" class="agora-tocando">Now Playing: -</span>
    </section>

    <script type="module" src="js/main.js?v=2026.06.09.1"></script>
</body>
</html>
